[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-unguided-bombing-calculator"
version = "0.1.0"
description = "Telemetry-calibrated GPS release calculator for unguided bombs in DCS World"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
]

[tool.setuptools]
py-modules = []
