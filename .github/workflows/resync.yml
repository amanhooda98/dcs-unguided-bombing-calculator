name: Resync Weapon Data

on:
  push:
    branches: [main]
    paths:
      - calibration/**
      - data/raw/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python and install locked dependencies
        run: uv sync --locked
      - name: Rebuild calibration artifacts
        run: uv run python calibration/calibrate_weapon_drag.py
      - name: Commit updated weapon data
        run: |
          if git diff --quiet -- data/processed/weapon_drag_database.json docs/weapon_drag_database.js; then
            echo "Weapon data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/weapon_drag_database.json docs/weapon_drag_database.js
          git commit -m "Update generated weapon data"
          git push
